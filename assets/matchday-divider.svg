<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="52" viewBox="0 0 1200 52" role="img" aria-label="Barcelona-inspired matchday divider">
  <defs>
    <linearGradient id="line"><stop stop-color="#004d98" stop-opacity="0"/><stop offset=".25" stop-color="#004d98"/><stop offset=".5" stop-color="#edbb00"/><stop offset=".75" stop-color="#a50044"/><stop offset="1" stop-color="#a50044" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
